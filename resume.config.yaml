# yaml-language-server: $schema=./resume.config.schema.json
version: 1

layout:
  # Uncomment to override the style in every source's documentclass.
  # style: sans
  paper: a4
  scale: 0.86       # Sans only
  tracking: -1.5   # Sans only, percent of an em
  ratio: 1.125     # Sans only, type scale
  margins:
    top: 0.4in
    bottom: 0.3in
    left: 0.35in
    right: 0.35in
  bulletSpacing: 0.15em
  bulletIndent: 1.5pc
  # Defaults: serif *1 / *1; sans *2 / *0.8.
  # sectionSpacing:
  #   before: "*2"
  #   after: "*0.8"

checks:
  bullets:
    maxLines: 2
    minLastLineFill: 0.8 # Defaults inherited by each section below.
  maxPages: 1

sections:
  SUMMARY:
    editable: true
    checks:
      maxLines: 3
      minLastLineFill: 0.5
  EDUCATION:
    editable: false
    checks:
      maxLines: 1
      minLastLineFill: 0 # Facts do not need padding to fill the line.
  WORK EXPERIENCE:
    editable: true
    checks:
      maxLines: 2
      minLastLineFill: 0.8
  PROJECTS:
    editable: true
    checks:
      maxLines: 2
      minLastLineFill: 0.65
  TALKS & AWARDS:
    editable: true
    checks:
      maxLines: 2
      minLastLineFill: 0.65
  SKILLS:
    editable: false
    checks:
      maxLines: 2
      minLastLineFill: 0
  # Use checks: false to skip a section's length checks.
  # editable is an instruction for the coding agent, not a file lock.

build:
  # outDir: ./output  # Omit to write beside each source file.
  keepLogs: false
